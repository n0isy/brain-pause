name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, release]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: self-hosted
    if: github.repository == 'n0isy/brain-pause' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Container Registry
        run: echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login -u "${{ secrets.REGISTRY_USER }}" --password-stdin ${{ vars.REGISTRY }}

      - name: Build Docker image
        run: |
          DOCKER_BUILDKIT=1 docker build \
            --cache-from ${{ vars.REGISTRY }}/${{ vars.IMAGE_NAME }}:${{ github.ref_name }} \
            -t ${{ vars.REGISTRY }}/${{ vars.IMAGE_NAME }}:${{ github.ref_name }} \
            .

      - name: Push Docker image
        run: docker push ${{ vars.REGISTRY }}/${{ vars.IMAGE_NAME }}:${{ github.ref_name }}

      - name: Tag GPU alias (identical image — pause has no GPU concern)
        run: docker tag ${{ vars.REGISTRY }}/${{ vars.IMAGE_NAME }}:${{ github.ref_name }} ${{ vars.REGISTRY }}/${{ vars.IMAGE_NAME }}:${{ github.ref_name }}-gpu

      - name: Push GPU alias
        run: docker push ${{ vars.REGISTRY }}/${{ vars.IMAGE_NAME }}:${{ github.ref_name }}-gpu
